<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hello World</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #F1EFE8;
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    color: #2C2C2A;
    padding: 24px;
  }
  .card {
    background: #FFFFFF;
    border: 1px solid rgba(0, 0, 0, 0.1);
    border-radius: 16px;
    padding: 40px 44px;
    max-width: 460px;
    width: 100%;
    text-align: center;
  }
  h1 {
    font-size: 24px;
    font-weight: 500;
    margin-bottom: 12px;
  }
  p {
    font-size: 14px;
    line-height: 1.7;
    color: #5F5E5A;
  }
  .tag {
    display: inline-block;
    margin-top: 24px;
    padding: 6px 14px;
    border-radius: 999px;
    background: #E1F5EE;
    color: #085041;
    font-size: 13px;
  }
  code {
    font-family: ui-monospace, Consolas, monospace;
    background: #F1EFE8;
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 13px;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Hello, World</h1>
    <p>这个页面现在只存在于你的电脑上。<br>把它推送到 GitHub 之后，它就属于互联网的一部分了。</p>
    <div class="tag">推送成功 ✓</div>
    <p style="margin-top: 24px; font-size: 13px;">
      由 <code>Shujiang21</code> 发布
    </p>
  </div>
</body>
</html>
